<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Angkringan AmanLahLek</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f1ea; color: #2c241e; }
    header { background: #3e2723; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.3rem; }
    .logout-btn { background: #5d4037; color: #ffccbc; border: 1px solid #8d6e63; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1150px; margin: auto; }
    .menu-section { flex: 2; min-width: 300px; }
    .cart-section { flex: 1; min-width: 290px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); height: fit-content; }
    
    /* Filter & Kategori Kasir */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .cat-btn { background: #fff; border: 1px solid #d7ccc8; color: #3e2723; padding: 7px 14px; border-radius: 20px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .cat-btn:hover { background: #efebe9; }
    .cat-btn.active { background: #d84315; color: #fff; border-color: #d84315; }
    .category-section { margin-bottom: 20px; }
    .category-title { font-size: 1.05rem; font-weight: bold; color: #3e2723; margin: 0 0 10px; padding-bottom: 5px; border-bottom: 2px solid #d7ccc8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
    .card:hover { border-color: #d84315; transform: translateY(-2px); }
    .card h3 { margin: 0 0 6px; font-size: 1rem; }
    .card .price { color: #d84315; font-weight: bold; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; }
    .qty-btn { background: #eee; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    
    /* Menu Tambahan di dalam Keranjang */
    .addon-box { background: #fdfbf7; border: 1px dashed #d7ccc8; padding: 10px 12px; border-radius: 8px; margin-top: 14px; }
    .addon-title { font-size: 0.85rem; font-weight: bold; color: #5d4037; margin-bottom: 8px; display: block; }
    .addon-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .addon-chip { background: #fff3e0; border: 1px solid #ffb74d; color: #e65100; padding: 6px 10px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .addon-chip:hover { background: #ffe0b2; }

    .total-box { font-size: 1.2rem; font-weight: bold; margin: 15px 0; display: flex; justify-content: space-between; border-top: 2px solid #eee; padding-top: 12px; }
    select, input[type="number"], input[type="text"], input[type="password"], button.pay-btn { width: 100%; padding: 11px; border-radius: 8px; font-size: 1rem; margin-top: 6px; box-sizing: border-box; }
    select, input[type="number"], input[type="text"], input[type="password"] { border: 1px solid #ccc; background: #fff; }
    .cash-box { background: #faf8f5; border: 1px solid #e6dfd5; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .quick-cash { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .quick-btn { flex: 1; min-width: 65px; background: #eee; border: 1px solid #ddd; padding: 6px 4px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 600; color: #3e2723; }
    .quick-btn:hover { background: #e0d7c6; }
    .change-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #ccc; font-weight: bold; font-size: 1.05rem; }
    .change-ok { color: #2e7d32; }
    .change-kurang { color: #c62828; }
    button.pay-btn { background: #d84315; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 14px; }
    button.pay-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* Layar Login Admin */
    #login-overlay { position: fixed; inset: 0; background: #3e2723; display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
    .login-box { background: #fff; padding: 28px 24px; border-radius: 14px; max-width: 340px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .login-box h2 { margin: 0 0 6px; color: #3e2723; text-align: center; }
    .login-box p.sub { margin: 0 0 18px; font-size: 0.88rem; color: #666; text-align: center; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: #3e2723; }
  </style>
</head>
<body>

<!-- Layar Login Admin -->
<div id="login-overlay">
  <div class="login-box">
    <h2>🔒 Login Kasir Admin</h2>
    <p class="sub">Angkringan AmanLahLek</p>
    <div class="form-group">
      <label for="admin-user">Username</label>
      <input type="text" id="admin-user" placeholder="Masukkan Username..." autocomplete="off">
    </div>
    <div class="form-group">
      <label for="admin-pass">Password</label>
      <input type="password" id="admin-pass" placeholder="Masukkan Password..." onkeyup="if(event.key==='Enter') prosesLogin()">
    </div>
    <button id="login-btn" class="pay-btn" onclick="prosesLogin()">Masuk ke Kasir</button>
    <p id="login-error" style="color:#c62828; font-size:0.85rem; display:none; margin-top:12px; text-align:center;"></p>
    <div style="text-align:center; margin-top:16px;">
      <a href="index.html" style="color:#795548; font-size:0.85rem; text-decoration:none;">← Kembali ke Menu Pelanggan</a>
    </div>
  </div>
</div>

<header>
  <div>
    <h1>🍢 Kasir Angkringan AmanLahLek</h1>
    <small id="admin-info">Sistem Kasir Online</small>
  </div>
  <button class="logout-btn" onclick="logoutAdmin()">Keluar</button>
</header>

<div class="container">
  <div class="menu-section">
    <div class="filter-bar">
      <button class="cat-btn active" onclick="pilihKategori('Semua', this)">Semua</button>
      <button class="cat-btn" onclick="pilihKategori('Coffee', this)">☕ Coffee</button>
      <button class="cat-btn" onclick="pilihKategori('Soft Drink', this)">🥤 Soft Drink</button>
      <button class="cat-btn" onclick="pilihKategori('Makanan Ringan', this)">🍟 Makanan Ringan</button>
    </div>
    <div id="menu-container">Memuat menu dari Spreadsheet...</div>
  </div>

  <div class="cart-section">
    <h3>Pesanan Saat Ini</h3>
    <div id="cart-items"><p style="color:#888;">Belum ada item dipilih.</p></div>

    <!-- Menu Tambahan (Add-on seperti ICE) -->
    <div id="addon-section" class="addon-box" style="display:none;">
      <span class="addon-title">🧊 Menu Tambahan:</span>
      <div id="addon-buttons" class="addon-list"></div>
    </div>
    
    <div class="total-box">
      <span>Total:</span>
      <span id="total-price">Rp 0</span>
    </div>

    <label for="payment-method"><strong>Metode Pembayaran:</strong></label>
    <select id="payment-method" onchange="aturTampilanTunai()">
      <option value="Tunai">Tunai / Cash</option>
      <option value="QRIS">QRIS</option>
      <option value="Transfer">Transfer Bank</option>
    </select>

    <div id="cash-section" class="cash-box">
      <label for="cash-received"><strong>Uang Diterima (Rp):</strong></label>
      <input type="number" id="cash-received" placeholder="Masukkan nominal uang..." min="0" step="500" oninput="hitungKembalian()">
      
      <div class="quick-cash">
        <button type="button" class="quick-btn" onclick="setUangPas()">Uang Pas</button>
        <button type="button" class="quick-btn" onclick="setUang(10000)">10rb</button>
        <button type="button" class="quick-btn" onclick="setUang(20000)">20rb</button>
        <button type="button" class="quick-btn" onclick="setUang(50000)">50rb</button>
        <button type="button" class="quick-btn" onclick="setUang(100000)">100rb</button>
      </div>

      <div class="change-row">
        <span>Kembalian:</span>
        <span id="change-amount" class="change-ok">Rp 0</span>
      </div>
    </div>

    <button id="pay-btn" class="pay-btn" onclick="prosesBayar()" disabled>Simpan & Bayar</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz1NjdAcdePA0Zo8_A3D3nWdrCLBvZETZa5V7ebbq2uvmBQLqbtpBCXpIfs--yqijl6hw/exec";

  let daftarMenu = [];
  let daftarTambahan = [];
  let kategoriAktif = "Semua";
  let keranjang = {};
  let totalBelanja = 0;

  window.addEventListener("DOMContentLoaded", () => {
    const loggedUser = sessionStorage.getItem("adminAngkringan");
    if (loggedUser) {
      bukaHalamanKasir(loggedUser);
    }
  });

  function prosesLogin() {
    const username = document.getElementById("admin-user").value.trim();
    const password = document.getElementById("admin-pass").value.trim();
    const btn = document.getElementById("login-btn");
    const errEl = document.getElementById("login-error");

    if (!username || !password) {
      errEl.innerText = "Username dan Password wajib diisi.";
      errEl.style.display = "block";
      return;
    }

    btn.innerText = "Memeriksa akun...";
    btn.disabled = true;
    errEl.style.display = "none";

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "login",
        username: username,
        password: password
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        sessionStorage.setItem("adminAngkringan", username);
        bukaHalamanKasir(username);
      } else {
        errEl.innerText = "Username atau Password salah!";
        errEl.style.display = "block";
        btn.innerText = "Masuk ke Kasir";
        btn.disabled = false;
      }
    })
    .catch(() => {
      errEl.innerText = "Gagal terhubung ke server Spreadsheet.";
      errEl.style.display = "block";
      btn.innerText = "Masuk ke Kasir";
      btn.disabled = false;
    });
  }

  function bukaHalamanKasir(username) {
    document.getElementById("login-overlay").style.display = "none";
    document.getElementById("admin-info").innerText = "Kasir aktif: " + username;
    muatMenu();
  }

  function logoutAdmin() {
    sessionStorage.removeItem("adminAngkringan");
    location.reload();
  }

  function muatMenu() {
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {
          daftarMenu = data;
          daftarTambahan = [];
        } else {
          daftarMenu = data.menu || [];
          daftarTambahan = data.tambahan || [];
        }
        renderMenuTerkelompok();
        renderTambahan();
      })
      .catch(() => {
        document.getElementById("menu-container").innerHTML = "Gagal memuat menu. Periksa URL API.";
      });
  }

  function pilihKategori(kat, btnEl) {
    kategoriAktif = kat;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");
    renderMenuTerkelompok();
  }

  function renderMenuTerkelompok() {
    const container = document.getElementById("menu-container");
    const hasil = daftarMenu.filter(item => {
      const itemKat = (item.kategori || "").trim().toLowerCase();
      return (kategoriAktif === "Semua") || (itemKat === kategoriAktif.toLowerCase());
    });

    if (hasil.length === 0) {
      container.innerHTML = "<p style='color:#795548;'>Belum ada menu pada kategori ini.</p>";
      return;
    }

    container.innerHTML = "";
    const urutanKategori = ["Coffee", "Soft Drink", "Makanan Ringan"];
    const ikonKategori = { "Coffee": "☕", "Soft Drink": "🥤", "Makanan Ringan": "🍟" };

    const grup = {};
    hasil.forEach(item => {
      const kat = (item.kategori || "Lainnya").trim();
      if (!grup[kat]) grup[kat] = [];
      grup[kat].push(item);
    });

    const daftarKunci = [...new Set([...urutanKategori, ...Object.keys(grup)])];

    daftarKunci.forEach(kat => {
      if (!grup[kat] || grup[kat].length === 0) return;

      const section = document.createElement("div");
      section.className = "category-section";

      const ikon = ikonKategori[kat] || "🍽️";
      section.innerHTML = `<div class="category-title">${ikon} ${kat}</div>`;

      const grid = document.createElement("div");
      grid.className = "grid";

      grup[kat].forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<h3>${item.nama}</h3><div class="price">Rp ${item.harga.toLocaleString("id-ID")}</div>`;
        div.onclick = () => tambahItem(item);
        grid.appendChild(div);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  function renderTambahan() {
    const box = document.getElementById("addon-section");
    const container = document.getElementById("addon-buttons");
    
    if (daftarTambahan.length === 0) {
      box.style.display = "none";
      return;
    }

    box.style.display = "block";
    container.innerHTML = "";
    daftarTambahan.forEach(addon => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "addon-chip";
      btn.innerText = `+ ${addon.nama} (Rp ${addon.harga.toLocaleString("id-ID")})`;
      btn.onclick = () => tambahItem(addon);
      container.appendChild(btn);
    });
  }

  function tambahItem(item) {
    if (!keranjang[item.id]) {
      keranjang[item.id] = { ...item, qty: 1 };
    } else {
      keranjang[item.id].qty++;
    }
    renderKeranjang();
  }

  function ubahQty(id, delta) {
    keranjang[id].qty += delta;
    if (keranjang[id].qty <= 0) delete keranjang[id];
    renderKeranjang();
  }

  function renderKeranjang() {
    const container = document.getElementById("cart-items");
    const keys = Object.keys(keranjang);
    totalBelanja = 0;

    if (keys.length === 0) {
      container.innerHTML = `<p style="color:#888;">Belum ada item dipilih.</p>`;
      document.getElementById("total-price").innerText = "Rp 0";
      document.getElementById("cash-received").value = "";
      hitungKembalian();
      return;
    }

    container.innerHTML = "";
    keys.forEach(id => {
      const item = keranjang[id];
      const subtotal = item.harga * item.qty;
      totalBelanja += subtotal;
      container.innerHTML += `
        <div class="cart-item">
          <div>
            <strong>${item.nama}</strong><br>
            <small>Rp ${subtotal.toLocaleString("id-ID")}</small>
          </div>
          <div>
            <button class="qty-btn" onclick="ubahQty('${id}', -1)">-</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button class="qty-btn" onclick="ubahQty('${id}', 1)">+</button>
          </div>
        </div>
      `;
    });

    document.getElementById("total-price").innerText = "Rp " + totalBelanja.toLocaleString("id-ID");
    hitungKembalian();
  }

  function aturTampilanTunai() {
    const metode = document.getElementById("payment-method").value;
    const cashSection = document.getElementById("cash-section");
    cashSection.style.display = (metode === "Tunai") ? "block" : "none";
    hitungKembalian();
  }

  function setUangPas() {
    if (totalBelanja > 0) {
      document.getElementById("cash-received").value = totalBelanja;
      hitungKembalian();
    }
  }

  function setUang(nominal) {
    document.getElementById("cash-received").value = nominal;
    hitungKembalian();
  }

  function hitungKembalian() {
    const payBtn = document.getElementById("pay-btn");
    const metode = document.getElementById("payment-method").value;
    const changeEl = document.getElementById("change-amount");

    if (totalBelanja === 0) {
      changeEl.innerText = "Rp 0";
      changeEl.className = "change-ok";
      payBtn.disabled = true;
      return;
    }

    if (metode !== "Tunai") {
      payBtn.disabled = false;
      return;
    }

    const uangDiterima = parseFloat(document.getElementById("cash-received").value) || 0;
    const selisih = uangDiterima - totalBelanja;

    if (uangDiterima === 0) {
      changeEl.innerText = "Rp 0";
      changeEl.className = "change-ok";
      payBtn.disabled = true;
    } else if (selisih < 0) {
      changeEl.innerText = `Kurang Rp ${Math.abs(selisih).toLocaleString("id-ID")}`;
      changeEl.className = "change-kurang";
      payBtn.disabled = true;
    } else {
      changeEl.innerText = `Rp ${selisih.toLocaleString("id-ID")}`;
      changeEl.className = "change-ok";
      payBtn.disabled = false;
    }
  }

  function prosesBayar() {
    const btn = document.getElementById("pay-btn");
    btn.innerText = "Menyimpan ke Spreadsheet...";
    btn.disabled = true;

    const itemsArray = Object.values(keranjang);
    const detailStr = itemsArray.map(i => `${i.nama} (${i.qty}x)`).join(", ");
    const metode = document.getElementById("payment-method").value;
    const uangDiterima = parseFloat(document.getElementById("cash-received").value) || totalBelanja;
    const kembalian = (metode === "Tunai") ? (uangDiterima - totalBelanja) : 0;
    const kasir = sessionStorage.getItem("adminAngkringan") || "Admin";

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ 
        action: "transaksi",
        detail: detailStr, 
        total: totalBelanja, 
        metode: metode,
        bayar: uangDiterima,
        kembali: kembalian,
        kasir: kasir
      })
    })
    .then(res => res.json())
    .then(data => {
      let infoKembali = (metode === "Tunai") ? `\nKembalian: Rp ${kembalian.toLocaleString("id-ID")}` : "";
      alert(`Transaksi Berhasil!\nNo: ${data.noTrx}\nTotal: Rp ${totalBelanja.toLocaleString("id-ID")}${infoKembali}`);
      
      keranjang = {};
      document.getElementById("cash-received").value = "";
      renderKeranjang();
      btn.innerText = "Simpan & Bayar";
    })
    .catch(() => {
      alert("Terjadi kesalahan saat menyimpan transaksi.");
      btn.innerText = "Simpan & Bayar";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
